openapi: 3.1.0
info:
  title: Activity API
  version: 1.0.0
paths:
  /activity:
    get:
      summary: List recent project activity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Activity entries }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
